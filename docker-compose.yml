# Coolify-ready compose file.
#
# Coolify: New Resource → Public/Private Repository → Build Pack "Docker Compose".
# Every ${VAR} below shows up in Coolify's "Environment Variables" tab;
# ${VAR:?} marks a required variable.
#
# Plain Docker: copy .env.example → .env next to this file, then `docker compose up -d`.

services:
  sanity-backup:
    build:
      context: .
      args:
        SANITY_CLI_VERSION: ${SANITY_CLI_VERSION:-latest}
    # Or skip building and use the published image:
    # image: ghcr.io/derweili/back-sanity-up:latest
    restart: unless-stopped
    environment:
      # Mode: "cron" = built-in scheduler, "idle" = use Coolify Scheduled Tasks
      - BACKUP_MODE=${BACKUP_MODE:-cron}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 3 * * *}
      - RUN_ON_STARTUP=${RUN_ON_STARTUP:-false}
      - TZ=${TZ:-Europe/Berlin}

      # Sanity
      - SANITY_PROJECT_ID=${SANITY_PROJECT_ID:?}
      - SANITY_AUTH_TOKEN=${SANITY_AUTH_TOKEN:?}
      - SANITY_DATASETS=${SANITY_DATASETS:-production}
      - SANITY_EXPORT_FLAGS=${SANITY_EXPORT_FLAGS:-}
      - BACKUP_NAME=${BACKUP_NAME:-}

      # S3
      - S3_BUCKET=${S3_BUCKET:?}
      - S3_PREFIX=${S3_PREFIX:-sanity-backups}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_STORAGE_CLASS=${S3_STORAGE_CLASS:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-central-1}

      # Heartbeat (optional)
      - HEARTBEAT_URL=${HEARTBEAT_URL:-}
      - HEARTBEAT_SEND_START=${HEARTBEAT_SEND_START:-false}
    # Multi-project: mount a folder of *.env files (one per project). Then the
    # Sanity/S3 variables above can be dropped — each file brings its own.
    # volumes:
    #   - /etc/sanity-backup:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x supercronic || pgrep -x sleep"]
      interval: 60s
      timeout: 5s
      retries: 3
